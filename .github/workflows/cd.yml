name: Node.js CI/CD to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Send deployment command to EC2
        shell: bash
        run: |
          cat > deploy.sh <<'EOF'
                    set -e
          export HOME=/root
          APP_DIR=/home/ubuntu/nodejs-github-actions-cicd
          cd "$APP_DIR"
          sudo -u ubuntu git config --global --add safe.directory "$APP_DIR"
          sudo -u ubuntu git fetch origin main
          sudo -u ubuntu git reset --hard origin/main
          sudo -u ubuntu npm ci --omit=dev
          systemctl restart nodejs-app
          echo "Waiting for Node.js on port 3000..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Node.js is responding"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null

          echo "Waiting for Nginx..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/ >/dev/null; then
              echo "Health check passed"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1/ >/dev/null

          echo "Deployment completed successfully"
          EOF

          PARAMS=$(jq -n --rawfile s deploy.sh '{commands: [$s]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Node.js application from GitHub Actions" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query Status \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment."
          exit 1
