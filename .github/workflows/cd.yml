
name: Node.js CI/CD to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and audit application
    runs-on: ubuntu-latest

    steps:
      
      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_JSON=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          ID_TOKEN=$(printf '%s' "$TOKEN_JSON" | jq -r '.value')
          export ID_TOKEN

          python3 - <<'PY'
          import os, json, base64

          token = os.environ["ID_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in (
              "iss", "aud", "sub", "repository",
              "repository_id", "repository_owner_id",
              "ref", "event_name"
          ):
              print(f"{key}: {claims.get(key)}")
          PY


    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Send deployment command to EC2
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Node.js application from GitHub Actions" \
            --parameters 'commands=["set -e","cd /home/ubuntu/nodejs-github-actions-cicd","git config --global --add safe.directory /home/ubuntu/nodejs-github-actions-cicd","git fetch origin main","git reset --hard origin/main","npm ci --omit=dev","sudo systemctl restart nodejs-app","sudo systemctl restart nodejs-app","for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:3000/ >/dev/null; then echo Node.js is responding; break; fi; echo Waiting for Node.js...; sleep 1; done","curl -fsS http://127.0.0.1:3000/ >/dev/null",,"for i in $(seq 1 30); do if curl -fsS http://127.0.0.1/ >/dev/null; then echo Health check passed; break; fi; echo Waiting for application...; sleep 1; done","curl -fsS http://127.0.0.1/ >/dev/null","echo Deployment completed successfully"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query Status \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment."
          exit 1
